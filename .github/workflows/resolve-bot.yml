name: Resolve and schedule markets

on:
  schedule:
    # Once a day, at 00:00 UTC. Started at every 10 minutes, which was
    # too tight, back-to-back runs could fire before the previous run's
    # transactions had time to confirm, piling up pending/duplicate
    # resolve attempts on the same market. Daily gives plenty of room.
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run resolve
        env:
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}

name: Resolve and schedule markets

on:
  schedule:
    # Once a day, at 00:00 UTC. The bot is optional because settlement is
    # permissionless; this cadence is only for background maintenance and
    # scheduled-market creation.
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: resolve-bot
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run resolve
        env:
          BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
